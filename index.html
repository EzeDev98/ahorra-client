    <!-- The loading screen below, styled here so it looks the same in dev (where the stylesheet arrives with the script) as in production. Same values as LoadingScreen.css and AppLogo.css: change them together. -->
    <style>
      body { margin: 0; }
      .loading-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; }
      .loading-screen .ui-logo { color: #2A4B9B; font: 400 20px/28px "Red Hat Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    <div id="root">
